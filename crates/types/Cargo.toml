[package]
name = "types"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
# Only the `wasm` crate turns this on; native consumers (server, checks)
# never pull wasm-bindgen into their tree (enforced by checks/crate_layering.rs).
tsify = { version = "0.5.8", features = ["js"], optional = true }
wasm-bindgen = { workspace = true, optional = true }

[features]
ts = ["dep:tsify", "dep:wasm-bindgen"]

[lints]
workspace = true
