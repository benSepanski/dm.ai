# Verification-only dev tool (architecture: chargen-content). Fetches a
# pinned Foundry pf2e snapshot into a gitignored cache and writes
# rules-data/attestation.json. Never shipped; nothing depends on it; CI
# never invokes it (checks/attestation.rs scans for that).

[package]
name = "reference-check"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
types = { workspace = true }
ruleset-pf2e = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
